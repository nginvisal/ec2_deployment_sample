name: Deployment
run-name: Deploying to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Bootstrap: install git and Node.js if missing
            if ! command -v node &> /dev/null; then
              if command -v dnf &> /dev/null; then
                sudo dnf install -y nodejs npm git
              elif command -v yum &> /dev/null; then
                sudo yum install -y nodejs npm git
              fi
            fi

            # Bootstrap: install PM2 if missing
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi

            # Bootstrap: clone repo on first deploy
            if [ ! -d "${{ secrets.EC2_APP_DIR }}" ]; then
              git clone ${{ secrets.REPO_URL }} ${{ secrets.EC2_APP_DIR }}
            fi

            # Deploy
            cd ${{ secrets.EC2_APP_DIR }}
            git pull origin main
            npm ci
            npm run build
            pm2 restart nextjs-app || pm2 start npm --name "nextjs-app" -- start
